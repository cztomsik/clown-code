[package]
name = "clown_code"
version = "0.1.0"
edition = "2021"
description = "A local, terminal-based AI coding assistant (Rust port of clown-code)"

[[bin]]
name = "clown_code"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
crossterm = "0.28"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
# preserve_order keeps JSON object keys in insertion order (declaration
# order, not sorted) — part of the stable session-file wire format.
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
tracing-subscriber = "0.3"
